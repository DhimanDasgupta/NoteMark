// Compose stability configuration, shared by the Compose compiler and the stability analyzer.
// https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// Styles API: a fun interface with no mutable state. Implementations are lambdas, CombinedStyle
// (value equality) or the Style singleton; theme reads happen in the styleable node, not here.
androidx.compose.foundation.style.Style

// Navigation 3 keys: every app key (app/nav/NavKeys.kt) is a data object or a data class of vals.
androidx.navigation3.runtime.NavKey

// Read-only persistent collection; stable when its elements are (`*` keeps the element's stability).
kotlinx.collections.immutable.PersistentList<*>
